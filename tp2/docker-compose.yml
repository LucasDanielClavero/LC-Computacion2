services:
  api:
    build: .
    container_name: tareas_tp2
    ports:
      - "8000:8000"   # la API queda accesible en localhost:8000 desde el host
    volumes:
      - ./volcados:/app/volcados   # los volcados de estado quedan en el host
    environment:
      - NUM_WORKERS=3
      - NUM_PROCESOS=2
      - TIMEOUT_DEFAULT=60
      - LIMITE_APAGADO=10
      - COLA_MAXSIZE=100
    # Docker manda SIGKILL si el contenedor no cierra a tiempo (10 s por
    # defecto). Tiene que ser MAYOR que LIMITE_APAGADO, o el SIGKILL llega
    # antes de que termine el apagado ordenado y el volcado del estado.
    stop_grace_period: 20s
    restart: unless-stopped
